spring.application.name=backend
server.port=8080

# Cloud MySQL Connection (Aiven via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-30df0f6d-carshield-app.b.aivencloud.com:24285/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true